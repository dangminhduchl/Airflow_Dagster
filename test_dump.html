<!DOCTYPE html>
<html>
<head><script src="./mermaid.min.js"></script></head>
<body>
<div id="container"></div>
<script>
async function run() {
  mermaid.initialize({ startOnLoad: false, theme: 'dark' });
  const { svg } = await mermaid.render('my-svg', 'flowchart LR\n A --> B');
  document.getElementById('container').innerHTML = svg;
  document.title = "RENDER_DONE";
}
run();
</script>
</body>
</html>
